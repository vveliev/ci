# -*- coding: utf-8 -*-
# vim: ft=yaml
# yamllint disable rule:truthy
---
name: auto-update github-actions

on:
  # every day at midnight
  schedule:
    - cron: 0 0 * * 0
  # on demand
  workflow_dispatch: null
  workflow_call: null

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate-gh-actions:
    name: autoupdate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN cannot push changes under .github/workflows.
          token: '${{ secrets.WORKFLOW_UPDATE_TOKEN }}'

      - name: Run GitHub Actions Version Updater
        uses: saadmk11/github-actions-version-updater@v1.0.1
        with:
          # PAT with contents, workflows, and pull-request write access.
          token: '${{ secrets.WORKFLOW_UPDATE_TOKEN }}'
